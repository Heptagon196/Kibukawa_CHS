<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>癸生川网页番外汉化</title>
    <link rel="stylesheet" href="app.css">
  </head>
  <body>
    <header class="toolbar">
      <button class="brand" type="button" data-action="home">癸生川网页番外汉化</button>
      <button id="home-button" class="home-button" type="button" data-action="home" hidden>返回作品列表</button>
    </header>

    <main>
      <section id="library" class="library" aria-labelledby="library-title">
        <h1 id="library-title">选择作品</h1>
        <p class="summary">按原作公开日期排列（日本时间）。</p>
        <div class="game-list">
          <article class="game-card">
            <button type="button" data-game="birthday">
              <span><strong>诞生纪念日事件</strong><small>短篇 · 约 3,000 字 · 预计 15–25 分钟</small></span><b>打开</b>
            </button>
            <div class="release-info">原作公开：<time datetime="2019-12-08">2019-12-08</time><a href="https://x.com/ikrmmso/status/1203684122394128385" data-release="birthday" target="_blank" rel="noopener noreferrer" title="在系统默认浏览器中打开">发布推文 ↗</a></div>
          </article>
          <article class="game-card">
            <button type="button" data-game="saina-onsen">
              <span><strong>狭稻温泉乡杀人事件</strong><small>原作未完成 · 约 13,700 字 · 预计 60–90 分钟</small></span><b>打开</b>
            </button>
            <div class="release-info">原作公开：<time datetime="2020-04-19">2020-04-19</time><a href="https://x.com/ikrmmso/status/1251751495822766081" data-release="saina-onsen" target="_blank" rel="noopener noreferrer" title="在系统默认浏览器中打开">发布推文 ↗</a></div>
          </article>
          <article class="game-card">
            <button type="button" data-game="operation-check-2">
              <span><strong>运行测试事件Ⅱ</strong><small>推理测试篇 · 约 4,400 字 · 预计 15–30 分钟</small></span><b>打开</b>
            </button>
            <div class="release-info">原作公开：<time datetime="2026-06-30">2026-06-30</time><a href="https://x.com/ikrmmso/status/2071972021366571209" data-release="operation-check-2" target="_blank" rel="noopener noreferrer" title="在系统默认浏览器中打开">发布推文 ↗</a></div>
          </article>
        </div>
        <p id="link-status" role="status" hidden></p>
        <p class="footnote">三部作品均包含本地运行资源，游玩时无需联网。</p>
      </section>
      <section id="player-shell" class="player-shell" hidden>
        <div class="loading" id="loading">正在载入作品……</div>
        <iframe id="game-frame" title="游戏画面" allow="autoplay; fullscreen" referrerpolicy="no-referrer"></iframe>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
